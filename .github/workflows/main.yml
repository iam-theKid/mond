name: Build mond IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project mond.xcodeproj \
            -scheme mond

      - name: Build mond
        run: |
          set -o pipefail

          xcodebuild \
            -project mond.xcodeproj \
            -scheme mond \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" \
            -maxdepth 1 \
            -type d \
            -name "mond.app" \
            -print \
            -quit)

          if [ -z "$APP_PATH" ]; then
            echo "mond.app not found"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 4 -print
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/mond.app"

          cd "$RUNNER_TEMP/ipa"
          zip -r "$RUNNER_TEMP/mond.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mond-unsigned
          path: ${{ runner.temp }}/mond.ipa
